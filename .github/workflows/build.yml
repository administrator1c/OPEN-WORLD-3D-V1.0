name: Open World 3D V1.6 - Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - '**/*.zip'
      - '**/*.gd'
      - '**/*.tscn'
      - '**/project.godot'
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Godot project (extract source ZIP if needed)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find "$GITHUB_WORKSPACE" -name project.godot -not -path '*/.git/*' -print -quit)"
          if [ -z "$PROJECT" ]; then
            mkdir -p "$RUNNER_TEMP/game"
            while IFS= read -r -d '' ZIP; do
              echo "Checking $ZIP"
              if unzip -Z1 "$ZIP" | grep -qE '(^|/)project\.godot$'; then
                unzip -oq "$ZIP" -d "$RUNNER_TEMP/game"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            PROJECT="$(find "$RUNNER_TEMP/game" -name project.godot -print -quit)"
          fi
          if [ -z "$PROJECT" ]; then echo '::error::Missing project.godot in source or ZIP'; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT"
      - name: Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot/releases/download/4.3-stable
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -oq /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-export "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -oq /tmp/templates.tpz -d /tmp/godot-export
          cp /tmp/godot-export/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android editor and signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # Set a predictable Android debug export preset regardless of older ZIP settings.
          python3 - <<'PYTHON'
          import os,pathlib
          p=pathlib.Path(os.environ['PROJECT_DIR'])/'export_presets.cfg'
          s=p.read_text() if p.exists() else ''
          if '[preset.0]' not in s: raise SystemExit('Missing Android export preset')
          if 'keystore/debug=' not in s: s+='
keystore/debug=""
keystore/debug_user="androiddebugkey"
keystore/debug_password="android"
'
          p.write_text(s)
          PYTHON
      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$PROJECT_DIR" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
      - name: Build debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk" 2>&1 | tee "$RUNNER_TEMP/export.log"
          test -s "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Build-Logs
          path: |
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/export.log
          if-no-files-found: warn
