name: Open World 3D - Auto Extract and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - '*.zip'
      - '**/*.zip'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'main.tscn'
      - 'scripts/**'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate project or automatically extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(find "$GITHUB_WORKSPACE" -type f -name project.godot -not -path '*/.git/*' -print -quit)"
          if [[ -z "$PROJECT" ]]; then
            mkdir -p "$RUNNER_TEMP/game"
            while IFS= read -r -d '' ZIP; do
              echo "Inspecting: $ZIP"
              if unzip -Z1 "$ZIP" | grep -Eq '(^|/)project[.]godot$'; then
                echo "Extracting Godot source: $ZIP"
                unzip -oq "$ZIP" -d "$RUNNER_TEMP/game"
                PROJECT="$(find "$RUNNER_TEMP/game" -type f -name project.godot -print -quit)"
                [[ -n "$PROJECT" ]] && break
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print0)
          fi
          if [[ -z "$PROJECT" ]]; then
            echo '::error::No project.godot found. Upload the complete game source ZIP, not only the workflow ZIP.'
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -not -path '*/.git/*' | head -80
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT")"
          [[ -f "$PROJECT_DIR/export_presets.cfg" ]] || { echo '::error::Missing export_presets.cfg in Godot project'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Godot project: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          [[ -x "$SDKMANAGER" ]] || { echo '::error::sdkmanager not found'; exit 1; }
          "$SDKMANAGER" --sdk_root="$SDK" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/godotengine/godot/releases/download/4.3-stable'
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -oq "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/templates" "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -oq "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          cp "$RUNNER_TEMP/templates/templates/"* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          godot --headless --version

      - name: Configure Android debug signing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          KEYSTORE="$HOME/.android/debug.keystore"
          if [[ ! -f "$KEYSTORE" ]]; then
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US'
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          # Put explicit keystore fields under [preset.0.options].
          PRESET="$PROJECT_DIR/export_presets.cfg"
          sed -i '/^keystore\/debug=/d; /^keystore\/debug_user=/d; /^keystore\/debug_password=/d' "$PRESET"
          cat >> "$PRESET" <<EOF
          keystore/debug="$KEYSTORE"
          keystore/debug_user="androiddebugkey"
          keystore/debug_password="android"
          EOF

      - name: Import Godot project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$PROJECT_DIR" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/import.log"

      - name: Build Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path "$PROJECT_DIR" --export-debug Android \
            "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk" 2>&1 | tee "$RUNNER_TEMP/export.log"
          test -s "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Build-Logs
          path: |
            ${{ runner.temp }}/import.log
            ${{ runner.temp }}/export.log
          if-no-files-found: warn
