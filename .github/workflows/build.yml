name: Extract ZIP and locate Godot project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/game"

          echo "Searching for project.godot..."

          PROJECT=$(find "$GITHUB_WORKSPACE" \
            -type f -name "project.godot" \
            -not -path '*/.git/*' \
            -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "Searching for ZIP files..."

            find "$GITHUB_WORKSPACE" \
              -type f -iname "*.zip" \
              -not -path '*/.git/*' \
              -print0 | while IFS= read -r -d '' ZIP; do

                echo "Extracting: $ZIP"
                unzip -oq "$ZIP" -d "$RUNNER_TEMP/game"
              done

            PROJECT=$(find "$RUNNER_TEMP/game" \
              -type f -name "project.godot" \
              -print -quit)
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Missing project.godot"
            echo "Files found:"
            find "$RUNNER_TEMP/game" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT")

          echo "Found project: $PROJECT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
