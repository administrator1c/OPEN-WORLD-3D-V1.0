name: OPEN WORLD 3D V1.5 - Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - '**/*.zip'
      - '**/project.godot'
      - '**/*.gd'
      - '**/*.tscn'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate and extract Godot game
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/game"
          PROJECT="$(find "$GITHUB_WORKSPACE" -type f -name project.godot -not -path '*/.git/*' -print -quit)"
          if [[ -z "$PROJECT" ]]; then
            while IFS= read -r -d '' ZIP; do
              echo "Inspecting ZIP: $ZIP"
              TARGET="$RUNNER_TEMP/game/$(basename "$ZIP" .zip)"
              mkdir -p "$TARGET"
              unzip -oq "$ZIP" -d "$TARGET"
            done < <(find "$GITHUB_WORKSPACE" -type f -iname '*.zip' -not -path '*/.git/*' -print0)
            PROJECT="$(find "$RUNNER_TEMP/game" -type f -name project.godot -print -quit)"
          fi
          if [[ -z "$PROJECT" ]]; then
            echo '::error::Missing project.godot. Upload the actual Godot source ZIP (OPEN-WORLD-3D-V1.0.zip), not only the workflow ZIP.'
            echo 'Repository files:'
            find "$GITHUB_WORKSPACE" -maxdepth 4 -type f | head -100
            echo 'Extracted files:'
            find "$RUNNER_TEMP/game" -maxdepth 6 -type f | head -100
            exit 1
          fi
          echo "Found project: $PROJECT"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/godotengine/godot/releases/download/4.3-stable'
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          godot --headless --version

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [[ ! -f "$HOME/.android/debug.keystore" ]]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          if [[ ! -f "$PROJECT_DIR/export_presets.cfg" ]]; then
            cat > "$PROJECT_DIR/export_presets.cfg" <<'EOF'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          advanced_options=false
          export_filter="all_resources"
          export_path="build/OpenWorld3D-debug.apk"

          [preset.0.options]
          package/unique_name="com.openworld3d.game"
          package/name="Open World 3D"
          architectures/arm64-v8a=true
          architectures/armeabi-v7a=false
          gradle_build/use_gradle_build=false
          EOF
          fi
          # Signing settings are provided to Godot through its supported environment variables.
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey' >> "$GITHUB_ENV"
          echo 'GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android' >> "$GITHUB_ENV"

      - name: Import game
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$PROJECT_DIR" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path "$PROJECT_DIR" \
            --export-debug Android "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk" \
            2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Build-Logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-export.log
          if-no-files-found: ignore
