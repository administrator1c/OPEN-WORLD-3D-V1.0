
name: OPEN WORLD 3D V1.0 - Extract ZIP and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'OPEN-WORLD-3D-V1.0.zip'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.3'
      GAME_ZIP: OPEN-WORLD-3D-V1.0.zip
      APK_NAME: OpenWorld3D-debug.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Find and extract game ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -type f -name "$GAME_ZIP" -not -path './.git/*' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: Upload $GAME_ZIP to repository." >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/game"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/game"
          PROJECT="$(find "$RUNNER_TEMP/game" -type f -name project.godot -print -quit)"
          if [ -z "$PROJECT" ]; then
            echo "ERROR: project.godot not found." >&2
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          test -f "$PROJECT_DIR/export_presets.cfg"

      - name: Install Godot 4.3 and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://github.com/godotengine/godot/releases/download/4.3-stable'
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 /tmp/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v4.3-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --headless --version

      - name: Configure Android signing and Godot editor
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import project assets
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path "$PROJECT_DIR" --editor --import --quit

      - name: Build Android Debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/build/$APK_NAME"
          test -s "$GITHUB_WORKSPACE/build/$APK_NAME"
          ls -lh "$GITHUB_WORKSPACE/build/$APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
          if-no-files-found: error
          retention-days: 14
