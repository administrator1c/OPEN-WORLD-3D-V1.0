name: OPEN WORLD 3D V1.1 - Auto Extract and Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'OPEN-WORLD-3D-V1.0.zip'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GODOT_VERSION: '4.3'
      GAME_ZIP: 'OPEN-WORLD-3D-V1.0.zip'
      APK_NAME: 'OpenWorld3D-debug.apk'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME}" >> "$GITHUB_ENV"

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GAME_ZIP" || { echo "Missing $GAME_ZIP at repository root"; exit 1; }
          mkdir -p "$RUNNER_TEMP/open-world"
          unzip -q "$GAME_ZIP" -d "$RUNNER_TEMP/open-world"
          PROJECT_FILE="$(find "$RUNNER_TEMP/open-world" -type f -name project.godot -print -quit)"
          test -n "$PROJECT_FILE" || { echo 'Missing project.godot inside ZIP'; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          test -f "$PROJECT_DIR/export_presets.cfg" || { echo 'Missing export_presets.cfg'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-tpl "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-tpl
          cp -a /tmp/godot-tpl/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --headless --version

      - name: Configure debug keystore and Godot SDK paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import game
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$PROJECT_DIR" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Export Android APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/build/$APK_NAME" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "$GITHUB_WORKSPACE/build/$APK_NAME"
          ls -lh "$GITHUB_WORKSPACE/build/$APK_NAME"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Build-Logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-export.log
          if-no-files-found: ignore
