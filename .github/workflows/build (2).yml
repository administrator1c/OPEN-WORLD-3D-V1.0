name: OPEN WORLD 3D V1.2 - Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'OPEN-WORLD-3D-V1.0.zip'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GAME_ZIP: OPEN-WORLD-3D-V1.0.zip
      GODOT_VERSION: '4.3'
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include Android SDK.
      # Avoid android-actions/setup-android, which failed in the previous run.
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK" || { echo "Android SDK directory not found: $SDK"; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "Android SDK: $SDK"
          test -d "$SDK/platform-tools" || { echo 'Missing Android platform-tools'; exit 1; }
          find "$SDK/platforms" -maxdepth 1 -type d -name 'android-*' | sort || true
          find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort || true
          if [ ! -d "$SDK/platforms/android-34" ] || [ ! -d "$SDK/build-tools/34.0.0" ]; then
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -print -quit)"
            test -n "$SDKMANAGER" || { echo 'sdkmanager not found'; exit 1; }
            "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
          fi

      - name: Extract ZIP and locate Godot project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -type f -name "$GAME_ZIP" -not -path '*/.git/*' -print -quit)"
          test -n "$ZIP" || { echo "Missing $GAME_ZIP in repository"; exit 1; }
          mkdir -p "$RUNNER_TEMP/open-world"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/open-world"
          PROJECT="$(find "$RUNNER_TEMP/open-world" -type f -name project.godot -print -quit)"
          test -n "$PROJECT" || { echo 'Missing project.godot in ZIP'; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT")"
          test -f "$PROJECT_DIR/export_presets.cfg" || { echo 'Missing export_presets.cfg'; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install Godot 4.3 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$URL/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$URL/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-tpl "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-tpl
          cp -a /tmp/godot-tpl/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --headless --version

      - name: Configure Godot Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS

      - name: Import game resources
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path "$PROJECT_DIR" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Build debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
          if-no-files-found: error

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Build-Logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-export.log
          if-no-files-found: ignore
