name: OPEN WORLD 3D V1.3 - Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build.yml'
      - 'OPEN-WORLD-3D-V1.0.zip'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GODOT_VERSION: '4.3'
      GAME_ZIP: OPEN-WORLD-3D-V1.0.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK and tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;23.2.8568313' 'cmake;3.10.2.4988404'
          ls -la "$SDK/build-tools/34.0.0"

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find "$GITHUB_WORKSPACE" -name "$GAME_ZIP" -type f -not -path '*/.git/*' -print -quit)"
          test -n "$ZIP" || { echo "Missing $GAME_ZIP"; exit 1; }
          mkdir -p "$RUNNER_TEMP/game"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/game"
          PROJECT="$(find "$RUNNER_TEMP/game" -name project.godot -type f -print -quit)"
          test -n "$PROJECT" || { echo 'Missing project.godot'; exit 1; }
          PROJECT_DIR="$(dirname "$PROJECT")"
          test -f "$PROJECT_DIR/export_presets.cfg"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"
          cat "$PROJECT_DIR/export_presets.cfg"

      - name: Install Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          sudo install -m 755 "/tmp/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot-tpl "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-tpl
          cp -a /tmp/godot-tpl/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          godot --headless --version

      - name: Configure Android export
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=Android Debug,O=Android,C=US' -noprompt
          fi
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --verbose --path "$PROJECT_DIR" --editor --import --quit 2>&1 | tee "$RUNNER_TEMP/godot-import.log"

      - name: Build debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --verbose --path "$PROJECT_DIR" --export-debug Android "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk" 2>&1 | tee "$RUNNER_TEMP/godot-export.log"
          test -s "$GITHUB_WORKSPACE/build/OpenWorld3D-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Android-APK
          path: build/OpenWorld3D-debug.apk
          if-no-files-found: error

      - name: Upload logs if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWorld3D-Build-Logs
          path: |
            ${{ runner.temp }}/godot-import.log
            ${{ runner.temp }}/godot-export.log
          if-no-files-found: ignore
